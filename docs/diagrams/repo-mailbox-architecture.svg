<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mailbox-title mailbox-desc">
      <title id="mailbox-title">Repo-as-mailbox agent coordination</title>
      <desc id="mailbox-desc">Architecture diagram showing an implementer and an auditor agent exchanging commit-only messages through a git repository that acts as a mailbox, with marker-based polling on both sides.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Arrows first (behind boxes) -->
      <line x1="264" y1="304" x2="452" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="452" y1="368" x2="268" y2="368" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="936" y1="304" x2="748" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="748" y1="368" x2="932" y2="368" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 6-10px clear of the stroke) -->
      <rect x="306" y="284" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="358" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT COMMIT</text>
      <rect x="306" y="348" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="358" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLL · MARKER</text>
      <rect x="788" y="284" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW COMMIT</text>
      <rect x="788" y="348" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLL · MARKER</text>

      <!-- Node: Implementer -->
      <rect x="40" y="272" width="224" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="272" width="224" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="280" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="66" y="289" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="248" y="392" fill="#2d3142" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="152" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Implementer</text>
      <text x="152" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kimi · Hermes · any CLI</text>

      <!-- Node: Auditor -->
      <rect x="936" y="272" width="224" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="936" y="272" width="224" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="944" y="280" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="962" y="289" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="1144" y="392" fill="#2d3142" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="1048" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auditor</text>
      <text x="1048" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude Code · independent</text>

      <!-- Node: Repo mailbox (focal) -->
      <rect x="456" y="176" width="288" height="320" rx="8" fill="#f5f5f5"/>
      <rect x="456" y="176" width="288" height="320" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="600" y="204" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">REPO MAILBOX · GIT</text>

      <!-- Chip: STATE.md (focal) -->
      <rect x="480" y="224" width="240" height="64" rx="4" fill="#f5f5f5"/>
      <rect x="480" y="224" width="240" height="64" rx="4" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="600" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">STATE.md</text>
      <text x="600" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">who waits on whom</text>

      <!-- Chip: implementer mailbox -->
      <rect x="480" y="304" width="240" height="64" rx="4" fill="#f5f5f5"/>
      <rect x="480" y="304" width="240" height="64" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="600" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">implementer/</text>
      <text x="600" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SUBMIT · FIX · DONE</text>

      <!-- Chip: auditor mailbox -->
      <rect x="480" y="384" width="240" height="64" rx="4" fill="#f5f5f5"/>
      <rect x="480" y="384" width="240" height="64" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="600" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">auditor/</text>
      <text x="600" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REVIEW · STOP · REQUEST</text>

      <!-- Editorial callout -->
      <rect x="340" y="540" width="520" height="16" rx="2" fill="#f5f5f5"/>
      <text x="600" y="553" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">No direct channel — the repo is the transport; every message is a commit.</text>

      <!-- Legend strip -->
      <line x1="40" y1="612" x2="1160" y2="612" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="128" y1="628" x2="156" y2="628" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="164" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Write — a commit</text>

      <line x1="392" y1="628" x2="420" y2="628" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="428" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Poll — marker check</text>

      <rect x="648" y="622" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="670" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Mailbox state</text>

      <rect x="856" y="622" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="878" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The mailbox — focal</text>
    </svg>
