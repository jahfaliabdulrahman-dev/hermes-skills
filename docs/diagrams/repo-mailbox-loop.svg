<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rmloop-title rmloop-desc">
      <title id="rmloop-title">Repo-as-mailbox operating loop</title>
      <desc id="rmloop-desc">Operating loop with six stations — submit, detect, audit, verdict, execute, record — around one shared repo mailbox; work advances clockwise while every station writes state back to the mailbox hub.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Ring flow (solid arcs, clockwise) -->
      <path d="M 600.000 113.726 A 240 240 0 0 1 704.969 187.073" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 743.285 252.000 A 240 240 0 0 1 743.722 426.882" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 705.731 492.000 A 240 240 0 0 1 601.130 565.871" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 440.000 566.274 A 240 240 0 0 1 335.031 492.927" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 296.715 428.000 A 240 240 0 0 1 296.278 253.118" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 334.269 188.000 A 240 240 0 0 1 438.870 114.129" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Write-back spokes (dashed, inward) -->
      <line x1="520.000" y1="132.000" x2="520.000" y2="282.000" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="672.420" y1="252.000" x2="615.263" y2="285.000" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="672.420" y1="428.000" x2="615.263" y2="395.000" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="520.000" y1="548.000" x2="520.000" y2="398.000" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="367.580" y1="428.000" x2="424.737" y2="395.000" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="367.580" y1="252.000" x2="424.737" y2="285.000" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- Spoke labels (masked, 6-10px clear) -->
      <rect x="532" y="200" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="558" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>
      <rect x="532" y="466" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="558" y="475" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>
      <rect x="360" y="274" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="391" y="283" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE.MD</text>

      <!-- Station: Submit -->
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Submit</text>
      <text x="520" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one step, one commit</text>

      <!-- Station: Detect -->
      <rect x="648" y="188" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="188" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detect</text>
      <text x="728" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">poll fires on marker</text>

      <!-- Station: Audit (focal) -->
      <rect x="648" y="428" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="428" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="728" y="464" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audit</text>
      <text x="728" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">independent checks</text>

      <!-- Station: Verdict -->
      <rect x="440" y="548" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="548" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verdict</text>
      <text x="520" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verdict as a commit</text>

      <!-- Station: Execute -->
      <rect x="232" y="428" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="428" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute</text>
      <text x="312" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fix or next step</text>

      <!-- Station: Record -->
      <rect x="232" y="188" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="188" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record</text>
      <text x="312" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state moves forward</text>

      <!-- Hub: the shared record -->
      <rect x="420" y="288" width="200" height="104" rx="6" fill="#2d3142"/>
      <text x="520" y="336" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repo mailbox</text>
      <text x="520" y="354" fill="#f5f5f5" fill-opacity="0.80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the shared record</text>
    </svg>
